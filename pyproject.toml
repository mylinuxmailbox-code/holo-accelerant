[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "holo-accelerant"
version = "0.1.0"
description = "Holo Accelerant - Python package installation at ludicrous speed."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Holo Accelerant Project" }]
keywords = ["pip", "installer", "package-manager", "pypi", "performance", "uv"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "packaging>=23.0",
    "aiohttp>=3.8",
    "rich>=13.0",
    "httpx>=0.25",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
test = ["pytest>=7.0", "pytest-asyncio>=0.21"]
dev = ["build", "twine", "ruff"]

[project.scripts]
accelero = "accelero.cli.main:main"

[project.urls]
Homepage = "https://github.com/holo-accelerant/holo-accelerant"
"Bug Tracker" = "https://github.com/holo-accelerant/holo-accelerant/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
